# Reference configuration of the v2 correction: as v1, in the CMS W-mass convention (arXiv:2412.13872),
#   k' = k (1 + A - e k + q M/k)(1 + sqrt(a^2 + c^2/k^2) z),  k = 1/pT.
# Set RDS_NTUPLES to the folder with the slim ntuples, e.g.
#   export RDS_NTUPLES=~/Documents/RDs/understand_comb_slope/ntuples        (laptop)
#   export RDS_NTUPLES=/work/$USER/rds/ntuples                             (PSI Tier3)
name: RDs_2018BParking_DsPhiPi_trkcalib
version: v2

inputs:
  data: ["${RDS_NTUPLES}/rs_slim_21oct2026.root"]     # right-sign Ds mu, 2018 BParking
  mc:   ["${RDS_NTUPLES}/sig_slim_21oct2026.root"]    # Bs -> Ds(*) mu nu signal MC
  tree: tree

selection:
  expression: "(dsMu_m < 5.37) & (tv_prob > 0.05) & (sv_prob > 0.05) & (ds_vtx_cosine_xyz_pv > 0.99)"
  kk_window: 0.020
  dplus_veto: 0.050

model:
  convention: cms
  eta_edges: [0.0, 0.7, 1.2, 2.5]
  terms: [A, e, M, a2, c2]           # a2 = (a/1e-3)^2, c2 = (c/1e-4 GeV^-1)^2 in the fit
  shared: [e, c2]
  start: {A: 1.0e-3, a2: 11.0}

categories:
  pt_edges: [0.0, 1.0, 1.6, 100.0]
  split_charge: true

fit:
  mass_range: [1.920, 2.015]
  bin_width: 0.001
  background: expo2
  smooth_data: true
  seed: 12345

correction:
  seed: 20181
  dataset: "2018 BParking, right-sign Ds mu candidates (rs_slim_21oct2026)"
  mc: "Bs -> Ds(*) mu nu signal MC (sig_slim_21oct2026), all Ds -> phi pi candidates"
  notes:
    - "Statistical errors only; no systematic uncertainties yet."
    - "The muon gets the same correction with its own pT, charge and |eta|."

output:
  dir: "results/${name}_${version}"
